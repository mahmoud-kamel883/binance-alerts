name: binance-alerts
on:
  schedule:
    - cron: "7 * * * *"   # hourly at minute 7 (1h candles; avoids the busy top of the hour). Delays/skips possible.
  workflow_dispatch:
    inputs:
      state_selftest:
        description: "Write a harmless marker to state.json to test the state commit (dry-run only)"
        type: boolean
        default: false
concurrency:
  group: binance-alerts
  cancel-in-progress: false
permissions:
  contents: write          # only to commit state.json (sent-alert IDs)
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run alert script
        run: python3 -m unittest -q test_alert_bot && python3 alert_bot.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          DRY_RUN: ${{ vars.DRY_RUN || '1' }}
          STATE_SELFTEST: ${{ inputs.state_selftest && '1' || '0' }}
      - name: Save state (dedupe IDs)
        if: always()
        run: |
          git config user.name "alert-bot"; git config user.email "alert-bot@users.noreply.github.com"
          git add state.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "state" && git push)
